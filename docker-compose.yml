services:
  webterm:
    image: ghcr.io/thatguy-za/webterm:latest
    # Or build locally instead of pulling:
    # build: .
    container_name: webterm
    restart: unless-stopped
    ports:
      - "3000:3000" # exposing this to the internet? bind it to 127.0.0.1 and use an HTTPS reverse proxy: see the README
    # environment:
    #   WEBTERM_SESSION_TIMEOUT: "30m"   # sign people out after this long idle
    #   WEBTERM_TRUST_PROXY: "true"      # behind a reverse proxy: count logins per visitor
    #   WEBTERM_MAX_RDP: "10"            # most remote desktops open at once
    volumes:
      - webterm-data:/data

volumes:
  webterm-data:
