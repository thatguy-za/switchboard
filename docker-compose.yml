services:
  switchboard:
    image: ghcr.io/thatguy-za/switchboard:latest
    restart: unless-stopped
    ports:
      - "${SWITCHBOARD_PORT:-8080}:8080"
    environment:
      SWITCHBOARD_PORT: "8080"
      SWITCHBOARD_GUACD: guacd:4822
    volumes:
      - switchboard-data:/data
    depends_on:
      - guacd

  guacd:
    image: guacamole/guacd:1.5.5
    restart: unless-stopped

volumes:
  switchboard-data:
