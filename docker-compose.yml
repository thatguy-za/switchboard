services:
  switchboard:
    image: ghcr.io/thatguy-za/switchboard:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      SWITCHBOARD_PORT: "3000"
      SWITCHBOARD_SESSION_TIMEOUT: "${SWITCHBOARD_SESSION_TIMEOUT:-30m}"
      SWITCHBOARD_GUACD: guacd:4822
    volumes:
      - switchboard-data:/data
      # The master key is generated here on first run. Back it up from the admin
      # panel and keep the copy away from the data volume.
      - switchboard-keys:/keys
    depends_on:
      - guacd

  guacd:
    image: guacamole/guacd:1.5.5
    restart: unless-stopped

volumes:
  switchboard-data:
  switchboard-keys:
