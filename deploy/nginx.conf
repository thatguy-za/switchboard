# nginx in front of WebTerm. Put this in /etc/nginx/conf.d/ and adjust the
# name, the certificate paths and the upstream address.

map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

server {
	listen 80;
	server_name webterm.example.com;
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl;
	http2 on;
	server_name webterm.example.com;

	ssl_certificate     /etc/ssl/webterm/fullchain.pem;
	ssl_certificate_key /etc/ssl/webterm/privkey.pem;

	location / {
		proxy_pass http://webterm:3000;
		proxy_http_version 1.1;

		# Pass the Host header with its port: WebTerm checks it against the
		# page's Origin before it accepts a terminal or desktop WebSocket.
		proxy_set_header Host              $http_host;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# Terminals and desktops are WebSockets.
		proxy_set_header Upgrade    $http_upgrade;
		proxy_set_header Connection $connection_upgrade;

		# WebTerm pings every terminal every 25 seconds, so the default
		# 60 second timeout is already safe. This leaves headroom.
		proxy_read_timeout 300s;
		proxy_send_timeout 300s;
		proxy_buffering    off;
	}
}
